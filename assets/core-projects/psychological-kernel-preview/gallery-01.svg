<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#e8e5e9"/>
<g font-family="Inter Display, Inter, PingFang SC, Hiragino Sans GB, sans-serif" fill="#3b3444">
<text x="90.0" y="144.0" font-size="24" font-weight="600" letter-spacing="3">01 / 心理内核</text>
<text x="90.0" y="256.0" font-size="64.8" font-weight="700">研究框架</text>
<rect x="90.0" y="336.0" width="1020.0" height="911.9999999999999" fill="#fff" fill-opacity=".55"/>
<svg x="90.0" y="336.0" width="1020.0" height="911.9999999999999" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet">
<title id="title">心理内核的输入、状态接口与响应检验框架</title>
<desc id="desc">事件情境和角色特征输入轻量模型，生成九轴零到一状态，再经过结构、机制响应与游戏迁移验收。</desc>
<rect fill="#f0eef1" height="900" width="1200"/>
<g fill="#25242a" font-family="Inter, PingFang SC, sans-serif">
<text fill="#686371" font-size="17" font-weight="700" letter-spacing="2.5" x="58" y="68">PSYCHOLOGICAL KERNEL / SYSTEM MAP</text>
<text font-size="40" font-weight="700" x="58" y="132">情境输入，生成可检验的角色状态</text>
<text fill="#5d5964" font-size="20" x="58" y="177">接口结构与心理响应分层验收，输出可读不代表机制有效。</text>
<rect fill="#e7e9ed" height="292" rx="8" stroke="#858d9a" stroke-width="2" width="310" x="54" y="232"/>
<text fill="#646e7b" font-size="16" font-weight="700" letter-spacing="1.4" x="82" y="278">01 / INPUT</text>
<text font-size="27" font-weight="700" x="82" y="330">结构化输入</text>
<text fill="#4e5159" font-size="19" x="82" y="378">四项情境事实</text>
<text fill="#4e5159" font-size="19" x="82" y="411">十二项角色特征</text>
<text fill="#707784" font-size="15" x="82" y="474">未提供的特征保留 null</text>
<path d="M376 378h56m-12-10 12 10-12 10" fill="none" stroke="#88838f" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
<rect fill="#e8e2ec" height="292" rx="8" stroke="#81738d" stroke-width="2" width="310" x="444" y="232"/>
<text fill="#6c5d79" font-size="16" font-weight="700" letter-spacing="1.4" x="472" y="278">02 / MODEL</text>
<text font-size="27" font-weight="700" x="472" y="330">轻量状态模型</text>
<text fill="#4e4855" font-size="19" x="472" y="378">生成固定 JSON 契约</text>
<text fill="#4e4855" font-size="19" x="472" y="411">九个状态轴 · 0–1</text>
<text fill="#756a7e" font-size="15" x="472" y="474">字段定义固定，数值随输入</text>
<path d="M766 378h56m-12-10 12 10-12 10" fill="none" stroke="#88838f" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
<rect fill="#e9e8de" height="292" rx="8" stroke="#89876d" stroke-width="2" width="310" x="834" y="232"/>
<text fill="#706f58" font-size="16" font-weight="700" letter-spacing="1.4" x="862" y="278">03 / EVALUATION</text>
<text font-size="27" font-weight="700" x="862" y="330">分层验收</text>
<text fill="#505047" font-size="19" x="862" y="378">格式 · 方向 · 稳定性</text>
<text fill="#505047" font-size="19" x="862" y="411">选择性 · 下游适配</text>
<text fill="#73715e" font-size="15" x="862" y="474">通过验证后再讨论迁移</text>
<path d="M599 525v54m-10-12 10 12 10-12" fill="none" stroke="#88838f" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
<rect fill="#fff" height="158" rx="8" stroke="#aaa7ae" stroke-width="2" width="850" x="175" y="594"/>
<text fill="#686371" font-size="16" font-weight="700" letter-spacing="1.5" text-anchor="middle" x="600" y="642">CURRENT RESEARCH DECISION</text>
<text font-size="28" font-weight="700" text-anchor="middle" x="600" y="689">JSON 结构通过 ≠ 心理机制通过</text>
<text fill="#5d5964" font-size="16" text-anchor="middle" x="600" y="724">本轮工程迁移 REJECT · 心理有效性 INCONCLUSIVE</text>
<text fill="#6a6670" font-size="15" x="58" y="824">研究中间件接口与响应机制；没有声称已经证明 NPC 行为或游戏成绩。</text>
</g>
</svg>
<text x="90.0" y="1408.0" font-size="42.00000000000001" font-weight="500">从情境与角色输入，经九轴状态，到机制响应验证。</text>
<text x="90.0" y="1520.0" font-size="19" font-weight="500" letter-spacing="2">PROJECT NOTES / HUANG</text>
</g></svg>