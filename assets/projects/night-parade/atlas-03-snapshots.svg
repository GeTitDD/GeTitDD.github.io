<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">世界快照隔离与 Luna 工具契约</title><desc id="desc">作者草稿、发布版本与冻结对局分层隔离，工具执行绑定当前授权范围。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8babb5" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#101a22"/><text x="60" y="65.0" fill="#a7b9bf" font-size="20" font-weight="500" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">NIGHT PARADE / ENGINEERING ATLAS</text><text x="60" y="128.0" fill="#f3f0e8" font-size="42" font-weight="700" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">世界快照隔离与 Luna 工具契约</text><text x="60" y="180.0" fill="#b6c8cd" font-size="23" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">作者草稿、发布版本与冻结对局分层隔离，工具执行绑定当前授权范围。</text><path d="M60 215H1540" stroke="#566773" stroke-opacity=".6"/><rect x="60" y="280" width="440" height="175" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="84" y="323.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">作者草稿</text><text x="84" y="368.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">文件 · 类型 · 地图 · 指令</text><text x="84" y="400.56" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">保存草稿 ≠ 创建版本 ≠ 发布</text><rect x="580" y="280" width="440" height="175" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="604" y="323.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">project_versions.snapshot</text><text x="604" y="368.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">显式创建