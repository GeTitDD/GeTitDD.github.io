ont-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">读取 / 审计 / 编辑作者世界</text><text x="84" y="855.56" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">额外包含 gameStart：配置开局，不启动游戏</text><text x="84" y="888.12" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">run 先预演；不代替作者自动发布</text><rect x="840" y="735" width="700" height="225" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="864" y="778.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">Luna · 对局模式 / 19 工具</text><text x="864" y="823.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">只处理获授权的本局副本与历史</text><text x="864" y="855.56" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">写入后回读；revert 需要明确撤销请求</text><text x="864" y="888.12" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">作者身份也不赋予读取他人私有对局的权限</text><text x="60" y="1056.0" fill="#9babb4" font-size="19" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">ENGINEERING ATLAS / 规范状态、事务与权限边界</text></svg>