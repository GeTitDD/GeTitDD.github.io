<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">世界快照隔离与 Luna 工具权限</title><desc id="desc">作者草稿显式发布为 project_versions.snapshot，开局复制到 games.snapshot。三向同步比较共同基线、当前对局与作者草稿；Luna 作者与对局工具分别绑定授权范围。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8babb5" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter Display,Inter,Arial,PingFang SC,Hiragino Sans GB,sans-serif}</style>
<rect width="1600" height="1100" fill="#101a22"/>
<text x="60" y="64" font-size="19" fill="#b6c8cd" font-weight="500" text-anchor="start">NIGHT PARADE / ENGINEERING ATLAS · 03</text>
<text x="60" y="126" font-size="40" fill="#f3f0e8" font-weight="700" text-anchor="start">世界快照隔离与 Luna 工具权限</text>
<text x="60" y="174" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">作者草稿、发布版本与冻结对局分开管理，显式同步控制变更进入的时机。</text>
<path d="M60 200H1540" stroke="#405562"/>
<g data-node="作者草稿"><rect x="60" y="230" width="450" height="180" rx="4" fill="#18242d" stroke="#49606d" stroke-width="1.3"/>
<text x="84" y="273" font-size="30" fill="#f3f0e8" font-weight="600" text-anchor="start">作者草稿</text>
<text x="84" y="312" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">Studio 编辑态</text>
<text x="84" y="344" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">持续修改世界文件与配置</text>
</g>
<g data-node="发布版本"><rect x="575" y="230" width="450" height="180" rx="4" fill="#18242d" stroke="#49606d" stroke-width="1.3"/>
<text x="599" y="273" font-size="30" fill="#f3f0e8" font-weight="600" text-anchor="start">发布版本</text>
<text x="599" y="312" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">project_versions.snapshot</text>
<text x="599" y="344" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">显式发布后保存版本快照</text>
</g>
<g data-node="冻结对局"><rect x="1090" y="230" width="450" height="180" rx="4" fill="#18242d" stroke="#49606d" stroke-width="1.3"/>
<text x="1114" y="273" font-size="30" fill="#f3f0e8" font-weight="600" text-anchor="start">冻结对局</text>
<text x="1114" y="312" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">games.snapshot</text>
<text x="1114" y="344" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">开局读取，隔离在途世界</text>
</g>
<text x="542" y="272" font-size="18" fill="#8babb5" font-weight="400" text-anchor="middle">显式</text>
<text x="542" y="297" font-size="18" fill="#8babb5" font-weight="400" text-anchor="middle">发布</text>
<path data-connector="" d="M510 322H570" fill="none" stroke="#8babb5" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1057" y="272" font-size="18" fill="#8babb5" font-weight="400" text-anchor="middle">开局</text>
<text x="1057" y="297" font-size="18" fill="#8babb5" font-weight="400" text-anchor="middle">复制</text>
<path data-connector="" d="M1025 322H1085" fill="none" stroke="#8babb5" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="88" y="466" font-size="21" fill="#8babb5" font-weight="400" text-anchor="start">草稿变更</text>
<text x="824" y="466" font-size="21" fill="#8babb5" font-weight="400" text-anchor="start">共同基线</text>
<text x="1340" y="466" font-size="21" fill="#8babb5" font-weight="400" text-anchor="start">对局变更</text>
<path data-connector="" d="M285 410V514" fill="none" stroke="#8babb5" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-connector="" d="M800 410V514" fill="none" stroke="#8babb5" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-connector="" d="M1315 410V514" fill="none" stroke="#8babb5" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-node="显式三向同步 · Three-way Diff"><rect x="60" y="520" width="1480" height="155" rx="4" fill="#18242d" stroke="#8babb5" stroke-width="2"/>
<text x="84" y="563" font-size="28" fill="#f3f0e8" font-weight="600" text-anchor="start">显式三向同步 · Three-way Diff</text>
<text x="84" y="602" font-size="24" fill="#b6c8cd" font-weight="400" text-anchor="start">共同基线 ↔ 当前对局 ↔ 作者草稿</text>
<text x="84" y="634" font-size="24" fill="#b6c8cd" font-weight="400" text-anchor="start">比较差异后显式拉取或推送；作者热更新不会静默覆盖在途对局。</text>
</g>
<text x="88" y="718" font-size="21" fill="#8babb5" font-weight="400" text-anchor="start">作者范围</text>
<text x="850" y="718" font-size="21" fill="#8babb5" font-weight="400" text-anchor="start">本局范围</text>
<path data-connector="" d="M417 675V749" fill="none" stroke="#8babb5" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-connector="" d="M1183 675V749" fill="none" stroke="#8babb5" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-node="Luna · 作者模式 / 20 工具"><rect x="60" y="755" width="715" height="210" rx="4" fill="#18242d" stroke="#49606d" stroke-width="1.3"/>
<text x="84" y="798" font-size="27" fill="#f3f0e8" font-weight="600" text-anchor="start">Luna · 作者模式 / 20 工具</text>
<text x="84" y="837" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">作者草稿与开局配置</text>
<text x="84" y="869" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">批量 run → Dry-run → 写入回读</text>
<text x="84" y="901" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">revert 依据明确撤销指令执行</text>
</g>
<g data-node="Luna · 对局模式 / 19 工具"><rect x="825" y="755" width="715" height="210" rx="4" fill="#18242d" stroke="#49606d" stroke-width="1.3"/>
<text x="849" y="798" font-size="27" fill="#f3f0e8" font-weight="600" text-anchor="start">Luna · 对局模式 / 19 工具</text>
<text x="849" y="837" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">当前冻结副本与授权状态</text>
<text x="849" y="869" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">写入后回读，保持工具操作可追溯</text>
<text x="849" y="901" font-size="23" fill="#b6c8cd" font-weight="400" text-anchor="start">不得越权读取其他玩家私有历史</text>
</g>
<path d="M60 1022H1540" stroke="#405562"/>
<text x="60" y="1060" font-size="21" fill="#b6c8cd" font-weight="400" text-anchor="start">私有回执 · Prepared Checkpoint · GM Turn Trace：服务端权限隔离与审计。</text>
</svg>
