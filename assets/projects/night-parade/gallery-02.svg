b5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="80" y="770" width="1240" height="145" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="104" y="813.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">CAS 比较</text><text x="104" y="858.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">拒绝覆盖读取后已变化的状态</text><path d="M700.0 929L700.0 971" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="80" y="985" width="1240" height="145" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="104" y="1028.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">SQLite 事务</text><text x="104" y="1073.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">状态 · 角色 · 冻结快照 · 私有回执</text><text x="60" y="1356.0" fill="#9babb4" font-size="19" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">状态提交由服务端执行；叙述保存与机械提交可能分别成功。</text></svg>