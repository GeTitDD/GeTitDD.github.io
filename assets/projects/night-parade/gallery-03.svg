<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc"><title id="title">Storybook 分层长程记忆</title><desc id="desc">ENGINEERING OVERVIEW / 工程机制示意</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8babb5" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#101a22"/><text x="60" y="65.0" fill="#a7b9bf" font-size="20" font-weight="500" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">NIGHT PARADE / ENGINEERING ATLAS</text><text x="60" y="128.0" fill="#f3f0e8" font-size="42" font-weight="700" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">Storybook 分层长程记忆</text><text x="60" y="180.0" fill="#b6c8cd" font-size="23" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">ENGINEERING OVERVIEW / 工程机制示意</text><path d="M60 215H1340" stroke="#566773" stroke-opacity=".6"/><rect x="80" y="340" width="1240" height="145" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="104" y="383.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">第 8 回合归档</text><text x="104" y="428.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">当前 Scene 的客观事件记录</text><path d="M700.0 499L700.0 541" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="80" y="555" width="1240" height="145" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="104" y="598.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">每 10 个 Scene 合卷</text><text x="104" y="643.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">Chronicle 编年史 + 标签索引</text><path d="M700.0 714L700.0 756" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="80" y="770" width="1240" height="145" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="104" y="813.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">结构化场外召回</text><text x="104" y="858.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">只作为历史记忆，不当作新事件执行</text><path d="M700.0 929L700.0 971" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="80" y="985" width="1240" height="145" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="104" y="1028.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">显式 archive-band</text><text x="104" y="1073.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">超过 100 活跃索引时分层维护</text><text x="60" y="1356.0" fill="#9babb4" font-size="19" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">不静默丢弃历史；超长战役仍需要显式维护与进一步验证。</text></svg>