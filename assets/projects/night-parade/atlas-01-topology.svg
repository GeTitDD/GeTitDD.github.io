<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">三角色职责解耦与数据流</title><desc id="desc">同一 Next.js 应用中的职责和工具权限边界；不是三个独立部署的微服务。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8babb5" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#101a22"/><text x="60" y="65.0" fill="#a7b9bf" font-size="20" font-weight="500" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">NIGHT PARADE / ENGINEERING ATLAS</text><text x="60" y="128.0" fill="#f3f0e8" font-size="42" font-weight="700" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">三角色职责解耦与数据流</text><text x="60" y="180.0" fill="#b6c8cd" font-size="23" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">同一 Next.js 应用中的职责和工具权限边界；不是三个独立部署的微服务。</text><path d="M60 215H1540" stroke="#566773" stroke-opacity=".6"/><rect x="60" y="270" width="1480" height="115" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="84" y="313.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">Browser · Discover / Studio / Game UI</text><text x="84" y="358.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">Next.js 16 页面与 API：统一入口，显式区分作者、玩家与公开读取</text><path d="M800 385L800 425" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="430" width="450" height="215" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="84" y="473.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">主 GM / 既有编排</text><text x="84" y="518.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">预算装配 → 流式叙述</text><text x="84" y="550.56" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">提出结构化状态变化</text><text x="84" y="583.12" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">完整回复后交给服务端校验</text><rect x="575" y="430" width="450" height="215" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="599" y="473.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">Pi 后台维护</text><text x="599" y="518.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">步骤 / 工具预算</text><text x="599" y="550.56" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">准备演化与客观 Scene 归档</text><text x="599" y="583.12" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">仅返回 Prepared Checkpoint</text><rect x="1090" y="430" width="450" height="215" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="1114" y="473.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">Orbit 工具助手</text><text x="1114" y="518.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">持久聊天 · 9 Skills</text><text x="1114" y="550.56" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">作者 20 工具 / 对局 19 工具</text><text x="1114" y="583.12" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">按授权范围实际读写与回读</text><path d="M510 535L575 535" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="550.5" y="527.0" fill="#8babb5" font-size="18" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">准备</text><path d="M285 645L285 705" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1315 645V855H1050V940H1025" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="710" width="965" height="130" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="84" y="753.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">规范校验 → CAS 基线比较 → SQLite 原子提交</text><text x="84" y="798.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">主 GM 的机械状态提交路径；Pi 工具不直接写业务库</text><rect x="60" y="885" width="965" height="110" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="84" y="928.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">实例选定的 SQLite 数据库</text><text x="84" y="973.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">作者草稿 · 发布快照 · 冻结对局 · 机械状态与私有回执</text><path d="M545 840L545 885" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1090" y="885" width="450" height="110" rx="2" fill="#18242d" stroke="#8babb5" stroke-opacity=".7"/><text x="1114" y="928.0" fill="#f2f0e9" font-size="27" font-weight="600" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">既有模型传输适配器</text><text x="1114" y="973.0" fill="#dfe7e9" font-size="22" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">GM / Pi / Orbit 各自调用</text><path d="M1315 995L1315 1025" stroke="#8babb5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1323.0" y="1002.0" fill="#8babb5" font-size="18" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">外部模型供应商</text><text x="60" y="1056.0" fill="#9babb4" font-size="19" font-weight="400" font-family="Inter Display,Inter,Arial,PingFang SC,sans-serif">3000 与 3011 是隔离运行实例；主 GM 和 Orbit 尚未整体迁移至 Pi。</text><path d="M575 610L510 610" stroke="#8babb5" stroke-width="2" marker-end="url(#arrow)"/></svg>