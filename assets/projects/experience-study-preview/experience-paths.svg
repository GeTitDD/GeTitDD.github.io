<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">小模型 Agent 经验研究路径</title>
<desc id="desc">外部上下文检索、参数训练、持续更新三条路径分别评估，再检查任务结果、行为选择和失败后修正。</desc>
<rect width="1200" height="900" fill="#f2f2ec"/>
<g font-family="Inter, PingFang SC, sans-serif" fill="#222923">
  <text x="58" y="67" font-size="17" font-weight="700" letter-spacing="2.5" fill="#66746a">SMALL MODEL AGENT / RESEARCH MAP</text>
  <text x="58" y="132" font-size="42" font-weight="700">经验如何进入决策</text>
  <text x="58" y="178" font-size="22" fill="#586159">先分开经验路径，再检验模型是否真的改变了行动。</text>

  <rect x="52" y="226" width="344" height="292" rx="8" fill="#e4ece5" stroke="#557c68" stroke-width="2"/>
  <rect x="52" y="226" width="8" height="292" rx="4" fill="#557c68"/>
  <text x="82" y="276" font-size="17" font-weight="700" letter-spacing="1.5" fill="#557c68">01 / CONTEXT</text>
  <text x="82" y="333" font-size="29" font-weight="700">上下文检索</text>
  <text x="82" y="383" font-size="20" fill="#414a43">行动前把相关经验</text>
  <text x="82" y="415" font-size="20" fill="#414a43">提供给 Agent。</text>
  <text x="82" y="477" font-size="15" fill="#66746a">经验保留在输入上下文中</text>

  <rect x="428" y="226" width="344" height="292" rx="8" fill="#f1e8df" stroke="#bd7950" stroke-width="2"/>
  <rect x="428" y="226" width="8" height="292" rx="4" fill="#bd7950"/>
  <text x="458" y="276" font-size="17" font-weight="700" letter-spacing="1.5" fill="#a56540">02 / TRAIN</text>
  <text x="458" y="333" font-size="29" font-weight="700">参数训练</text>
  <text x="458" y="383" font-size="20" fill="#4b433c">在训练阶段更新模型</text>
  <text x="458" y="415" font-size="20" fill="#4b433c">权重，再独立评估。</text>
  <text x="458" y="477" font-size="15" fill="#8d6a53">检验训练是否带来额外收益</text>

  <rect x="804" y="226" width="344" height="292" rx="8" fill="#e8e9ee" stroke="#69728b" stroke-width="2"/>
  <rect x="804" y="226" width="8" height="292" rx="4" fill="#69728b"/>
  <text x="834" y="276" font-size="17" font-weight="700" letter-spacing="1.5" fill="#58627b">03 / UPDATE</text>
  <text x="834" y="333" font-size="29" font-weight="700">持续更新</text>
  <text x="834" y="383" font-size="20" fill="#454956">观察经验如何跨任务</text>
  <text x="834" y="415" font-size="20" fill="#454956">被保留和再次使用。</text>
  <text x="834" y="477" font-size="15" fill="#68708a">作为独立研究路径检验</text>

  <path d="M224 520v34h376" fill="none" stroke="#859087" stroke-width="2"/>
  <path d="M600 520v34" fill="none" stroke="#859087" stroke-width="2"/>
  <path d="M976 520v34H600" fill="none" stroke="#859087" stroke-width="2"/>
  <path d="m592 546 8 10 8-10" fill="none" stroke="#859087" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="212" y="574" width="776" height="170" rx="8" fill="#fff" stroke="#252c26" stroke-width="2"/>
  <text x="600" y="625" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.8" fill="#66746a">BEHAVIOR CHECK</text>
  <text x="600" y="672" text-anchor="middle" font-size="29" font-weight="700">行为验证</text>
  <text x="600" y="713" text-anchor="middle" font-size="19" fill="#4c554e">任务结果 · 行动选择 · 失败后修正</text>
  <text x="600" y="806" text-anchor="middle" font-size="16" fill="#687169">按各实验的对照条件解释，不把上下文收益等同于长期能力增长</text>
</g>
</svg>
